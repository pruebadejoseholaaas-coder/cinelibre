<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07090d">
<meta name="description" content="CineLibre — descubre y disfruta el cine dominicano.">
<title>CineLibre | Cine Dominicano</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07090d;--surface:#10141c;--surface2:#171c26;--text:#f7f8fb;--muted:#9aa3b2;--accent:#e50914;--line:rgba(255,255,255,.08);--radius:12px;--header:72px}
html{scroll-behavior:smooth}body{font-family:Inter,Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer}img{display:block;max-width:100%}a{color:inherit}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#343b48;border-radius:99px}
.header{position:sticky;top:0;z-index:500;height:var(--header);display:flex;align-items:center;gap:28px;padding:0 clamp(18px,4vw,60px);background:rgba(7,9,13,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
.logo{font-size:1.65rem;font-weight:950;letter-spacing:-1px;text-decoration:none;white-space:nowrap}.logo b{color:var(--accent)}.logo small{font-size:.65rem}
.nav{display:flex;gap:22px;align-items:center}.nav button{background:none;border:0;color:var(--muted);font-size:.9rem;transition:.25s}.nav button:hover,.nav button.active{color:#fff}.nav button.active{font-weight:800}
.header-spacer{flex:1}.search-wrap{position:relative}.search-toggle{border:0;background:transparent;color:#fff;font-size:1.15rem;padding:9px}
.search-box{position:absolute;right:0;top:48px;width:min(390px,calc(100vw - 28px));padding:12px;background:rgba(16,20,28,.98);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 55px rgba(0,0,0,.5);display:none}.search-box.open{display:block}
.search-box input{width:100%;background:#080b10;border:1px solid var(--line);color:#fff;padding:12px 14px;border-radius:9px;outline:0}.search-box input:focus{border-color:var(--accent)}
.search-results{max-height:320px;overflow:auto;margin-top:8px}.search-result{display:flex;gap:10px;padding:8px;border-radius:9px;cursor:pointer}.search-result:hover{background:var(--surface2)}.search-result img{width:42px;height:60px;object-fit:cover;border-radius:6px}.search-result div{min-width:0}.search-result strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.search-result span{color:var(--muted);font-size:.75rem}
.profile-btn{border:1px solid var(--line);background:var(--surface2);color:#fff;border-radius:999px;padding:8px 12px;font-size:.8rem}.profile-btn:hover{border-color:rgba(255,255,255,.2)}

.hero{min-height:72vh;position:relative;display:flex;align-items:flex-end;overflow:hidden}.hero-bg{position:absolute;inset:0;z-index:-2}.hero-bg img{width:100%;height:100%;object-fit:cover;filter:brightness(.42)}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,9,13,.98),rgba(7,9,13,.78) 38%,rgba(7,9,13,.18) 78%),linear-gradient(0deg,var(--bg),transparent 35%)}
.hero-content{width:min(650px,92%);margin:0 clamp(18px,6vw,90px) 80px}.eyebrow{display:inline-flex;background:var(--accent);padding:6px 10px;border-radius:6px;text-transform:uppercase;font-size:.68rem;font-weight:900;letter-spacing:.7px;margin-bottom:14px}
.hero h1{font-size:clamp(2.1rem,6vw,4.5rem);line-height:1.02;letter-spacing:-2px;margin-bottom:14px}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);margin-bottom:14px}.meta .year{color:#fff;font-weight:700}
.hero p{color:#c4cad3;line-height:1.65;max-width:560px;margin-bottom:22px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:11px 18px;font-weight:800;display:inline-flex;align-items:center;gap:8px;transition:.25s}.btn-primary{background:#fff;color:#080a0e}.btn-primary:hover{transform:translateY(-2px)}.btn-secondary{background:rgba(255,255,255,.12);color:#fff}.btn-secondary:hover{background:rgba(255,255,255,.2)}

.main{padding:0 clamp(18px,4vw,60px) 40px;margin-top:-20px;position:relative}.toolbar{display:flex;gap:10px;align-items:center;overflow:auto;padding:10px 0 20px;scrollbar-width:none}.toolbar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:9px 14px;border-radius:999px;font-size:.8rem;transition:.25s}.chip:hover,.chip.active{background:#fff;color:#080a0e;border-color:#fff}
.section{margin:20px 0 34px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:13px}.section-head h2{font-size:1.35rem}.section-head span{color:var(--muted);font-size:.78rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:15px}
.card{position:relative;min-width:0;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:var(--surface);cursor:pointer;box-shadow:0 7px 20px rgba(0,0,0,.2);transition:transform .25s,box-shadow .25s}.card:hover,.card:focus-visible{transform:translateY(-6px) scale(1.025);box-shadow:0 18px 42px rgba(0,0,0,.55);outline:none;z-index:4}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .35s}.card:hover img{transform:scale(1.06)}.card-gradient{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.95),rgba(0,0,0,.12) 62%,transparent)}
.card-info{position:absolute;left:12px;right:12px;bottom:11px}.card-title{font-size:.86rem;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-meta{display:flex;gap:7px;color:#c0c5ce;font-size:.68rem;margin-top:4px}
.card-play{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.8);width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:1rem;opacity:0;transition:.25s;box-shadow:0 10px 30px rgba(229,9,20,.35)}.card:hover .card-play,.card:focus-visible .card-play{opacity:1;transform:translate(-50%,-50%) scale(1)}
.card-fav{position:absolute;right:9px;top:9px;width:31px;height:31px;border:0;border-radius:50%;background:rgba(0,0,0,.68);color:#fff;z-index:3}.card-fav.active{background:var(--accent)}
.badge{position:absolute;left:9px;top:9px;background:var(--accent);padding:5px 7px;border-radius:5px;font-size:.58rem;font-weight:900;z-index:3}.badge.off{background:#343a45}
.empty{padding:55px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.empty strong{display:block;color:#fff;font-size:1.05rem;margin-bottom:5px}
footer{border-top:1px solid var(--line);padding:34px 20px;text-align:center;color:var(--muted);font-size:.76rem}.footer-links{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:12px}.footer-links strong{color:#fff}

.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s}.modal.open{opacity:1;pointer-events:auto}
.player{width:min(1120px,100%);max-height:96vh;overflow:auto}.player-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.player-title{font-weight:900;font-size:1rem}.player-title span{color:var(--muted);font-weight:500;margin-left:8px}
.close{width:42px;height:42px;border:0;border-radius:50%;background:var(--surface2);color:#fff;font-size:1.2rem}.close:hover{background:var(--accent)}
.video{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}.video iframe{width:100%;height:100%;border:0}.no-video{height:100%;min-height:300px;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted)}.no-video div{max-width:430px}.no-video b{display:block;color:#fff;font-size:1.15rem;margin:8px 0}
.player-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}.player-foot small{color:var(--muted)}.player-foot button{border:1px solid var(--line);background:var(--surface2);color:#fff;border-radius:8px;padding:9px 13px}.player-foot button:hover{border-color:var(--accent)}
.profile-modal .panel{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 18px 55px rgba(0,0,0,.5)}.profile-modal h2{margin-bottom:8px}.profile-modal p{color:var(--muted);font-size:.85rem;line-height:1.5;margin-bottom:18px}.profile-input{width:100%;background:#080b10;border:1px solid var(--line);color:#fff;padding:12px;border-radius:8px;outline:0}.profile-input:focus{border-color:var(--accent)}.profile-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);background:#fff;color:#080a0e;padding:10px 15px;border-radius:9px;font-size:.8rem;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:2000}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){.nav{display:none}.header{gap:12px}.hero{min-height:65vh}.hero-content{margin-bottom:55px}.grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}}
@media(max-width:520px){:root{--header:62px}.logo{font-size:1.35rem}.profile-btn{padding:7px 9px}.hero{min-height:59vh}.hero h1{letter-spacing:-1px}.hero-content{margin-bottom:38px}.main{padding-left:12px;padding-right:12px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.card{border-radius:8px}.card-info{left:8px;right:8px;bottom:8px}.card-title{font-size:.7rem}.card-meta{font-size:.58rem}.card-fav{width:27px;height:27px;right:6px;top:6px}.badge{left:6px;top:6px;font-size:.5rem;padding:4px}.card-play{width:40px;height:40px}.hero p{font-size:.85rem}}
</style>
</head>
<body>
<header class="header">
<a href="#" class="logo" id="homeLogo" aria-label="CineLibre, inicio">CINE<b>LIBRE</b> 🇩🇴</a>
<nav class="nav" aria-label="Navegación principal">
<button class="active" data-filter="all">Inicio</button><button data-filter="fav">❤️ Mi lista</button>
<button data-filter="comedy">Comedia</button><button data-filter="drama">Drama</button><button data-filter="horror">Terror</button><button data-filter="action">Acción</button>
</nav>
<div class="header-spacer"></div>
<div class="search-wrap"><button class="search-toggle" id="searchToggle" aria-label="Abrir buscador" aria-expanded="false">🔍</button>
<div class="search-box" id="searchBox"><input id="searchInput" type="search" placeholder="Buscar por título, año o categoría..." autocomplete="off" aria-label="Buscar películas"><div class="search-results" id="searchResults"></div></div></div>
<button class="profile-btn" id="profileButton">Perfil</button>
</header>

<section class="hero" aria-label="Película destacada">
<div class="hero-bg"><img id="heroImage" alt="" fetchpriority="high"><div class="hero-overlay"></div></div>
<div class="hero-content" id="heroContent"></div>
</section>

<main class="main"><div class="toolbar" id="categoryToolbar" aria-label="Filtros de películas"></div><div id="content"></div></main>
<footer><div class="footer-links"><strong>🎬 CineLibre</strong><span>Cine dominicano</span><span>Descubrimiento cultural</span></div><p>CineLibre — una plataforma pensada para descubrir el cine dominicano y caribeño.</p></footer>

<div class="modal" id="playerModal" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
<div class="player"><div class="player-head"><div class="player-title" id="playerTitle">Película <span id="playerMeta"></span></div><button class="close" id="closePlayer" aria-label="Cerrar reproductor">✕</button></div>
<div class="video" id="videoBox"></div><div class="player-foot"><small id="playerStatus"></small><div><button id="youtubeButton" style="display:none">▶ Abrir en YouTube</button><button id="closePlayer2">Cerrar</button></div></div></div>
</div>

<div class="modal profile-modal" id="profileModal" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
<div class="panel"><h2 id="profileTitle">Tu perfil</h2><p>Este perfil se guarda localmente en este dispositivo. Es la primera base para el futuro sistema real de cuentas de CineLibre.</p>
<input class="profile-input" id="profileName" maxlength="30" placeholder="¿Cómo quieres que te llamemos?">
<div class="profile-actions"><button class="btn btn-secondary" id="cancelProfile">Cancelar</button><button class="btn btn-primary" id="saveProfile">Guardar</button></div></div>
</div>
<div class="toast" id="toast"></div>

<script src="peliculas.js"></script>
<script>
'use strict';
const movies=Array.isArray(window.peliculas)?window.peliculas:[];
const categoryMap={comedy:'Comedia',drama:'Drama',horror:'Terror',action:'Acción',animation:'Animación',scifi:'Ciencia ficción',war:'Guerra',documentary:'Documental'};
const categoryOrder=['comedy','drama','horror','action','animation','scifi','war','documentary'];
const state={filter:'all',search:'',favorites:loadJSON('cinelibre_favs',[]),recent:loadJSON('cinelibre_recent',[]),profile:localStorage.getItem('cinelibre_profile')||'Invitado',current:null};
const $=id=>document.getElementById(id),content=$('content'),heroImage=$('heroImage'),heroContent=$('heroContent'),toolbar=$('categoryToolbar'),modal=$('playerModal'),videoBox=$('videoBox'),searchBox=$('searchBox'),searchInput=$('searchInput'),searchResults=$('searchResults'),toast=$('toast');
function loadJSON(k,f){try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:f}catch{return f}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function label(c){return categoryMap[c]||c||'Sin categoría'}
function getMovie(id){return movies.find(m=>Number(m.id)===Number(id))}
function hasVideo(m){return !!(m&&typeof m.videoId==='string'&&m.videoId.trim())}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function notify(m){toast.textContent=m;toast.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>toast.classList.remove('show'),2200)}
function getFeatured(){return movies.find(m=>m.featured===true)||movies.find(hasVideo)||movies[0]}

function renderHero(){
 const m=getFeatured();if(!m)return;
 heroImage.src=m.poster||'';heroImage.alt=`Fondo de ${m.title}`;
 heroContent.innerHTML=`<div class="eyebrow">${m.featured?'⭐ Destacada':'🎬 CineLibre'}</div><h1>${esc(m.title)}</h1>
 <div class="meta"><span class="year">${esc(m.year)}</span><span>${esc(label(m.category))}</span></div>
 <p>Descubre una película dominicana en CineLibre. Explora el catálogo, guarda tus favoritas y vuelve cuando quieras.</p>
 <div class="hero-actions"><button class="btn btn-primary" data-play="${m.id}">▶ Ver película</button><button class="btn btn-secondary" data-add="${m.id}">${state.favorites.includes(m.id)?'✓ En mi lista':'+ Mi lista'}</button></div>`;
}
function renderToolbar(){
 const items=[['all','Todas'],['fav','❤️ Mi lista'],...categoryOrder.map(c=>[c,label(c)])];
 toolbar.innerHTML=items.map(([id,t])=>`<button class="chip ${state.filter===id?'active':''}" data-filter="${id}">${esc(t)}</button>`).join('');
}
function filtered(){
 let list=[...movies];
 if(state.filter==='fav')list=list.filter(m=>state.favorites.includes(m.id));else if(state.filter!=='all')list=list.filter(m=>m.category===state.filter);
 const q=state.search.trim().toLowerCase();
 if(q)list=list.filter(m=>String(m.title).toLowerCase().includes(q)||String(m.year).includes(q)||label(m.category).toLowerCase().includes(q)||String(m.category).toLowerCase().includes(q));
 return list;
}
function card(m){
 const fav=state.favorites.includes(m.id),play=hasVideo(m);
 return `<article class="card" tabindex="0" role="button" aria-label="Ver ${esc(m.title)}" data-play="${m.id}">
 ${m.featured?'<span class="badge">⭐ Destacada</span>':''}${!play?'<span class="badge off">Sin video</span>':''}
 <button class="card-fav ${fav?'active':''}" data-fav="${m.id}" aria-label="${fav?'Quitar de Mi lista':'Agregar a Mi lista'}">${fav?'♥':'♡'}</button>
 <img src="${esc(m.poster||'')}" alt="Póster de ${esc(m.title)}" loading="lazy" onerror="this.onerror=null;this.style.opacity='.35'"><div class="card-gradient"></div>
 <button class="card-play" tabindex="-1" aria-hidden="true">${play?'▶':'i'}</button>
 <div class="card-info"><div class="card-title">${esc(m.title)}</div><div class="card-meta"><span>${esc(m.year)}</span><span>•</span><span>${esc(label(m.category))}</span></div></div></article>`;
}
function renderContent(){
 const list=filtered();
 if(!list.length){content.innerHTML=`<section class="section"><div class="empty"><strong>${state.filter==='fav'?'Tu lista está vacía':'No encontramos películas con esa búsqueda.'}</strong><span>Prueba otra búsqueda o selecciona otra categoría.</span></div></section>`;return}
 if(state.search||state.filter!=='all'){const title=state.filter==='fav'?'❤️ Mi lista':state.filter==='all'?'Resultados':label(state.filter);content.innerHTML=`<section class="section"><div class="section-head"><h2>${title}</h2><span>${list.length} película${list.length===1?'':'s'}</span></div><div class="grid">${list.map(card).join('')}</div></section>`;return}
 let html='',recent=state.recent.map(getMovie).filter(Boolean);
 if(recent.length)html+=`<section class="section"><div class="section-head"><h2>▶ Vistas recientes</h2><span>Tu actividad</span></div><div class="grid">${recent.slice(0,6).map(card).join('')}</div></section>`;
 const featured=movies.filter(m=>m.featured===true);
 if(featured.length)html+=`<section class="section"><div class="section-head"><h2>⭐ Destacadas</h2><span>${featured.length}</span></div><div class="grid">${featured.map(card).join('')}</div></section>`;
 categoryOrder.forEach(c=>{const a=movies.filter(m=>m.category===c);if(a.length)html+=`<section class="section"><div class="section-head"><h2>${label(c)}</h2><span>${a.length} películas</span></div><div class="grid">${a.map(card).join('')}</div></section>`});
 const extra=[...new Set(movies.map(m=>m.category))].filter(c=>!categoryOrder.includes(c));
 extra.forEach(c=>{const a=movies.filter(m=>m.category===c);html+=`<section class="section"><div class="section-head"><h2>${label(c)}</h2><span>${a.length} películas</span></div><div class="grid">${a.map(card).join('')}</div></section>`});
 content.innerHTML=html;
}
function renderAll(){renderHero();renderToolbar();renderContent()}
function addRecent(id){state.recent=[id,...state.recent.filter(x=>Number(x)!==Number(id))].slice(0,12);save('cinelibre_recent',state.recent)}
function toggleFavorite(id){const i=state.favorites.findIndex(x=>Number(x)===Number(id));if(i>=0){state.favorites.splice(i,1);notify('Quitada de Mi lista')}else{state.favorites.push(id);notify('Añadida a Mi lista')}save('cinelibre_favs',state.favorites);renderAll()}
function openPlayer(id){
 const m=getMovie(id);if(!m)return;state.current=m;addRecent(m.id);
 $('playerTitle').firstChild.textContent=m.title;$('playerMeta').textContent=`${m.year} · ${label(m.category)}`;
 const yt=$('youtubeButton');
 if(hasVideo(m)){videoBox.innerHTML=`<iframe src="https://www.youtube.com/embed/${encodeURIComponent(m.videoId)}?rel=0&modestbranding=1" title="Reproductor de ${esc(m.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;yt.style.display='inline-block';yt.onclick=()=>window.open(`https://www.youtube.com/watch?v=${encodeURIComponent(m.videoId)}`,'_blank','noopener,noreferrer');$('playerStatus').textContent='Reproduciendo mediante YouTube'}
 else{videoBox.innerHTML=`<div class="no-video"><div><div style="font-size:3rem">🎬</div><b>Esta película todavía no tiene un video disponible.</b><span>La película permanece en el catálogo y podrá reproducirse cuando se agregue un video.</span></div></div>`;yt.style.display='none';$('playerStatus').textContent='Video no disponible'}
 modal.classList.add('open');document.body.style.overflow='hidden';$('closePlayer').focus()
}
function closePlayer(){modal.classList.remove('open');document.body.style.overflow='';videoBox.innerHTML='';state.current=null}
function openProfile(){$('profileName').value=state.profile==='Invitado'?'':state.profile;$('profileModal').classList.add('open');$('profileName').focus();document.body.style.overflow='hidden'}
function closeProfile(){$('profileModal').classList.remove('open');document.body.style.overflow=''}
function saveProfile(){const n=$('profileName').value.trim()||'Invitado';state.profile=n;localStorage.setItem('cinelibre_profile',n);$('profileButton').textContent=n;closeProfile();notify(`Perfil actualizado: ${n}`)}
function doSearch(){
 state.search=searchInput.value;renderContent();
 if(state.search.trim()){const r=filtered().slice(0,8);searchResults.innerHTML=r.length?r.map(m=>`<div class="search-result" data-play="${m.id}"><img src="${esc(m.poster||'')}" alt=""><div><strong>${esc(m.title)}</strong><span>${esc(m.year)} · ${esc(label(m.category))}</span></div></div>`).join(''):`<div class="empty" style="padding:20px;border:0"><strong>No encontramos películas con esa búsqueda.</strong></div>`}else searchResults.innerHTML='';
}
document.addEventListener('click',e=>{
 const f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter===state.filter));renderContent();return}
 const fav=e.target.closest('[data-fav]');if(fav){e.stopPropagation();toggleFavorite(Number(fav.dataset.fav));return}
 const add=e.target.closest('[data-add]');if(add){toggleFavorite(Number(add.dataset.add));return}
 const p=e.target.closest('[data-play]');if(p){openPlayer(Number(p.dataset.play));return}
 if(e.target===modal)closePlayer();if(e.target===$('profileModal'))closeProfile();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(modal.classList.contains('open'))closePlayer();else if($('profileModal').classList.contains('open'))closeProfile();else if(searchBox.classList.contains('open')){searchBox.classList.remove('open');$('searchToggle').setAttribute('aria-expanded','false')}}
 if((e.key==='Enter'||e.key===' ')&&document.activeElement?.classList.contains('card')){e.preventDefault();openPlayer(Number(document.activeElement.dataset.play))}
});
$('searchToggle').addEventListener('click',()=>{const o=searchBox.classList.toggle('open');$('searchToggle').setAttribute('aria-expanded',String(o));if(o)searchInput.focus()});
searchInput.addEventListener('input',doSearch);$('closePlayer').addEventListener('click',closePlayer);$('closePlayer2').addEventListener('click',closePlayer);
$('profileButton').addEventListener('click',openProfile);$('cancelProfile').addEventListener('click',closeProfile);$('saveProfile').addEventListener('click',saveProfile);
$('profileName').addEventListener('keydown',e=>{if(e.key==='Enter')saveProfile()});
$('homeLogo').addEventListener('click',e=>{e.preventDefault();state.filter='all';state.search='';searchInput.value='';renderAll();window.scrollTo({top:0,behavior:'smooth'})});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap')){searchBox.classList.remove('open');$('searchToggle').setAttribute('aria-expanded','false')}});
$('profileButton').textContent=state.profile;renderAll();
console.info(`CineLibre: ${movies.length} películas cargadas.`);
if(!movies.length)console.error('No se encontró window.peliculas. Verifica peliculas.js.');
</script>
